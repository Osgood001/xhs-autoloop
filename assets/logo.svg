<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF2442;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B81;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="loop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD93D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background pill -->
  <rect x="0" y="0" width="480" height="120" rx="16" fill="#1a1a2e"/>
  <!-- Loop icon -->
  <g transform="translate(28, 24)">
    <!-- Outer ring -->
    <circle cx="36" cy="36" r="30" fill="none" stroke="url(#bg)" stroke-width="5"/>
    <!-- Arrow head on ring -->
    <polygon points="60,18 66,30 54,30" fill="url(#bg)" transform="rotate(-15, 60, 24)"/>
    <!-- Inner pulse -->
    <circle cx="36" cy="36" r="12" fill="url(#bg)" opacity="0.3"/>
    <circle cx="36" cy="36" r="6" fill="url(#bg)"/>
  </g>
  <!-- Title -->
  <text x="110" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">xhs-autoloop</text>
  <!-- Subtitle -->
  <text x="110" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#888888">Autonomous Content Engine for Xiaohongshu</text>
  <!-- Three pillars -->
  <g transform="translate(110, 90)">
    <rect x="0" y="0" width="56" height="20" rx="10" fill="#FF2442" opacity="0.15"/>
    <text x="28" y="14" font-family="system-ui, sans-serif" font-size="11" fill="#FF2442" text-anchor="middle" font-weight="600">保障</text>
    <rect x="66" y="0" width="56" height="20" rx="10" fill="#FFD93D" opacity="0.15"/>
    <text x="94" y="14" font-family="system-ui, sans-serif" font-size="11" fill="#FFD93D" text-anchor="middle" font-weight="600">培养</text>
    <rect x="132" y="0" width="56" height="20" rx="10" fill="#36A2EB" opacity="0.15"/>
    <text x="160" y="14" font-family="system-ui, sans-serif" font-size="11" fill="#36A2EB" text-anchor="middle" font-weight="600">评价</text>
  </g>
</svg>
